<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BASE7 CRM PRO</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit',sans-serif;
}


body{

    background:
    radial-gradient(
    circle at top,
    #10204a,
    #050816 45%
    );

    color:#fff;
    min-height:100vh;

}



/* =========================
SIDEBAR
========================= */


.sidebar{

position:fixed;

left:0;
top:0;

width:270px;

height:100vh;

background:
rgba(8,18,38,.85);

backdrop-filter:blur(20px);

border-right:

1px solid rgba(0,229,255,.15);

padding:25px;


}



.logo{

font-size:32px;

font-weight:800;

letter-spacing:1px;

color:#00e5ff;

}


.logo span{

color:#2563eb;

}



.tagline{

margin-top:5px;

color:#94a3b8;

font-size:13px;

margin-bottom:40px;

}



.menu button{

width:100%;

padding:15px;

margin-bottom:10px;

border:none;

background:transparent;

color:#cbd5e1;

border-radius:12px;

cursor:pointer;

text-align:left;

font-size:15px;

transition:.3s;

}



.menu button:hover{

background:#112044;

color:#00e5ff;

}





/* =========================
MAIN
========================= */


.main{

margin-left:270px;

padding:30px;

}




.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}



.topbar h1{

font-size:34px;

}



.topbar p{

color:#94a3b8;

}



.btn{

background:

linear-gradient(
90deg,
#2563eb,
#00e5ff
);

border:none;

padding:14px 22px;

border-radius:12px;

color:white;

font-weight:600;

cursor:pointer;

}





/* =========================
CARDS
========================= */


.cards{

display:grid;

grid-template-columns:

repeat(5,1fr);

gap:20px;

}



.card{

background:

rgba(11,18,37,.9);

border:

1px solid rgba(255,255,255,.06);

border-radius:20px;

padding:25px;

}



.card h3{

font-size:13px;

color:#94a3b8;

}


.card strong{

font-size:32px;

display:block;

margin-top:12px;

color:#00e5ff;

}





/* =========================
KANBAN
========================= */


.pipeline{

display:grid;

grid-template-columns:

repeat(7,1fr);

gap:15px;

margin-top:30px;

}



.column{

background:#0b1225;

border-radius:18px;

padding:15px;

min-height:350px;

border:

1px solid rgba(255,255,255,.05);

}



.column h3{

font-size:14px;

color:#94a3b8;

margin-bottom:15px;

}




.lead-card{

background:#111c38;

padding:15px;

border-radius:15px;

margin-bottom:12px;

cursor:pointer;

transition:.3s;

}



.lead-card:hover{

transform:translateY(-3px);

border:1px solid #00e5ff;

}




.lead-card strong{

display:block;

margin-bottom:5px;

}


.badge{

font-size:11px;

padding:5px 10px;

border-radius:20px;

display:inline-block;

margin-top:8px;

}


.hot{

background:#991b1b;

}


.medium{

background:#854d0e;

}


.cold{

background:#1e3a8a;

}





/* =========================
TABELA
========================= */


.box{

margin-top:30px;

background:#0b1225;

padding:25px;

border-radius:20px;

}



.box-header{

display:flex;

justify-content:space-between;

margin-bottom:20px;

}



input,
select,
textarea{

width:100%;

padding:13px;

background:#050816;

border:

1px solid #1e293b;

border-radius:10px;

color:white;

margin-bottom:12px;

}



.search{

width:300px;

}




table{

width:100%;

border-collapse:collapse;

}


th{

text-align:left;

padding:15px;

color:#64748b;

}


td{

padding:15px;

border-top:

1px solid rgba(255,255,255,.05);

}




/* =========================
MODAL
========================= */


.modal{

display:none;

position:fixed;

inset:0;

background:

rgba(0,0,0,.75);

align-items:center;

justify-content:center;

z-index:99;

}



.modal-content{

background:#0b1225;

width:550px;

max-height:90vh;

overflow:auto;

padding:30px;

border-radius:25px;

}



.close{

float:right;

cursor:pointer;

color:#94a3b8;

}




/* =========================
RESPONSIVO
========================= */


@media(max-width:1200px){


.cards{

grid-template-columns:

repeat(2,1fr);

}


.pipeline{

grid-template-columns:

repeat(2,1fr);

}


}



@media(max-width:700px){


.sidebar{

width:80px;

}


.logo{

font-size:18px;

}


.tagline,
.menu span{

display:none;

}



.main{

margin-left:80px;

}



.cards{

grid-template-columns:1fr;

}



.pipeline{

grid-template-columns:1fr;

}


}


</style>

</head>


<body>


<div class="sidebar">


<div class="logo">

BASE<span>7</span>

</div>


<div class="tagline">

CRM Intelligence PRO

</div>



<div class="menu">


<button>
📊 <span>Dashboard</span>
</button>


<button>
🔥 <span>Pipeline</span>
</button>


<button>
👥 <span>Leads</span>
</button>


<button>
📈 <span>Relatórios</span>
</button>


<button>
⚙️ <span>Configurações</span>
</button>


</div>


</div>





<div class="main">


<div class="topbar">


<div>

<h1>
BASE7 CRM PRO
</h1>


<p>
Controle sua prospecção e vendas.
</p>


</div>


<button class="btn" onclick="abrirModal()">

+ Novo Lead

</button>


</div>





<div class="cards">


<div class="card">

<h3>
Total Leads
</h3>

<strong id="total">
0
</strong>

</div>



<div class="card">

<h3>
Novos
</h3>

<strong id="novos">
0
</strong>

</div>



<div class="card">

<h3>
Negociação
</h3>

<strong id="negociacao">
0
</strong>

</div>



<div class="card">

<h3>
Clientes
</h3>

<strong id="clientes">
0
</strong>

</div>



<div class="card">

<h3>
Potencial
</h3>

<strong id="valor">
R$ 0</strong>

</div>


</div>
<!-- =========================
PIPELINE
========================= -->


<div class="pipeline" id="pipeline">


<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Novo')">

<h3>🆕 Novo</h3>

<div id="Novo"></div>

</div>



<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Contato')">

<h3>📞 Contato</h3>

<div id="Contato"></div>

</div>




<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Reunião')">

<h3>🤝 Reunião</h3>

<div id="Reunião"></div>

</div>





<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Proposta')">

<h3>📄 Proposta</h3>

<div id="Proposta"></div>

</div>





<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Negociação')">

<h3>🔥 Negociação</h3>

<div id="Negociação"></div>

</div>





<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Cliente')">

<h3>💰 Cliente</h3>

<div id="Cliente"></div>

</div>





<div class="column"
ondragover="permitirDrop(event)"
ondrop="soltar(event,'Perdido')">

<h3>❌ Perdido</h3>

<div id="Perdido"></div>

</div>


</div>






<!-- =========================
LISTAGEM
========================= -->


<div class="box">


<div class="box-header">


<h2>
Todos os Leads
</h2>


<input 
class="search"
id="pesquisa"
placeholder="Buscar empresa..."
>


</div>



<table>


<thead>

<tr>

<th>
Empresa
</th>

<th>
Nicho
</th>


<th>
Cidade
</th>


<th>
Score
</th>


<th>
Ações
</th>


</tr>

</thead>



<tbody id="lista">

</tbody>



</table>



</div>



</div>






<!-- =========================
MODAL
========================= -->


<div class="modal" id="modal">


<div class="modal-content">


<span class="close" onclick="fecharModal()">
✕
</span>


<h2>
Novo Lead
</h2>



<input id="empresa" placeholder="Empresa">


<input id="responsavel" placeholder="Responsável">


<input id="nicho" placeholder="Nicho">


<input id="cidade" placeholder="Cidade">


<input id="telefone" placeholder="WhatsApp">


<input id="instagram" placeholder="Instagram">


<input id="site" placeholder="Site">


<input id="valorLead" placeholder="Valor estimado R$">


<select id="origem">

<option>
Google
</option>

<option>
Instagram
</option>

<option>
Indicação
</option>

<option>
Prospecção ativa
</option>

</select>



<select id="status">


<option>
Novo
</option>

<option>
Contato
</option>

<option>
Reunião
</option>

<option>
Proposta
</option>

<option>
Negociação
</option>

<option>
Cliente
</option>

<option>
Perdido
</option>


</select>




<input type="date" id="followup">



<textarea 
id="obs"
placeholder="Observações">
</textarea>



<button class="btn" onclick="salvarLead()">

Salvar Lead

</button>



</div>


</div>







<script>


let leads =
JSON.parse(
localStorage.getItem("base7crm")
) || [];



let editando=null;





function salvarBanco(){

localStorage.setItem(
"base7crm",
JSON.stringify(leads)
);

}





function abrirModal(){

modal.style.display="flex";

}



function fecharModal(){

modal.style.display="none";

limpar();

}





function limpar(){

empresa.value="";
responsavel.value="";
nicho.value="";
cidade.value="";
telefone.value="";
instagram.value="";
site.value="";
valorLead.value="";
origem.value="Google";
status.value="Novo";
followup.value="";
obs.value="";

editando=null;

}






function salvarLead(){



let lead={


empresa:empresa.value,

responsavel:responsavel.value,

nicho:nicho.value,

cidade:cidade.value,

telefone:telefone.value,

instagram:instagram.value,

site:site.value,

valor:
Number(
valorLead.value.replace(/\D/g,"")
),

origem:origem.value,

status:status.value,

followup:followup.value,

obs:obs.value,


historico:[

{

data:new Date().toLocaleDateString(),

acao:"Lead criado"

}

]

};





if(editando!==null){

leads[editando]=lead;

}

else{

leads.push(lead);

}



salvarBanco();

render();

fecharModal();


}






function render(){


Object.keys({
Novo:1,
Contato:1,
Reunião:1,
Proposta:1,
Negociação:1,
Cliente:1,
Perdido:1

})
.forEach(x=>{

document.getElementById(x).innerHTML="";

});




let tabela="";



leads.forEach((l,i)=>{



let score=calcularScore(l);



let temp=
score>=70
?"🔥 Quente"
:
score>=40
?"🟡 Médio"
:
"❄️ Frio";





let card=`


<div 
class="lead-card"
draggable="true"
ondragstart="arrastar(${i})">


<strong>

${l.empresa}

</strong>


${l.cidade}


<br>


<span class="badge ${
score>=70?"hot":
score>=40?"medium":"cold"
}">

${temp}

</span>


</div>


`;



document.getElementById(l.status)
.innerHTML += card;





tabela += `


<tr>


<td>

${l.empresa}

</td>



<td>

${l.nicho}

</td>



<td>

${l.cidade}

</td>



<td>

${score}/100

</td>




<td>


<button onclick="editar(${i})">
✏️
</button>


<button onclick="whatsapp('${l.telefone}')">
📲
</button>


<button onclick="excluir(${i})">
🗑️
</button>


</td>



</tr>


`;



});




lista.innerHTML=tabela;



atualizarCards();


}







function calcularScore(l){


let score=0;



if(l.site)
score+=25;


if(l.instagram)
score+=15;


if(l.valor>3000)
score+=25;


if(l.telefone)
score+=15;


if(l.followup)
score+=20;



return score;


}







function atualizarCards(){



total.innerText=leads.length;


novos.innerText=

leads.filter(
x=>x.status=="Novo"
).length;



negociacao.innerText=

leads.filter(
x=>x.status=="Negociação"
).length;



clientes.innerText=

leads.filter(
x=>x.status=="Cliente"
).length;




let soma=

leads.reduce(
(a,b)=>a+b.valor,
0
);



valor.innerText=

"R$ "+
soma.toLocaleString("pt-BR");



}







function editar(i){


let l=leads[i];


empresa.value=l.empresa;

responsavel.value=l.responsavel;

nicho.value=l.nicho;

cidade.value=l.cidade;

telefone.value=l.telefone;

instagram.value=l.instagram;

site.value=l.site;

valorLead.value=l.valor;

origem.value=l.origem;

status.value=l.status;

followup.value=l.followup;

obs.value=l.obs;


editando=i;


abrirModal();


}








function excluir(i){


if(confirm("Excluir lead?")){


leads.splice(i,1);

salvarBanco();

render();


}

}







function whatsapp(numero){


numero=
numero.replace(/\D/g,'');


window.open(

"https://wa.me/55"+numero,

"_blank"

);


}






let arrastando=null;


function arrastar(i){

arrastando=i;

}



function permitirDrop(e){

e.preventDefault();

}



function soltar(e,statusNovo){


e.preventDefault();


leads[arrastando].status=statusNovo;



leads[arrastando]
.historico.push({

data:
new Date()
.toLocaleDateString(),

acao:
"Movido para "+statusNovo

});



salvarBanco();

render();


}








pesquisa
.addEventListener(
"keyup",
()=>{


let termo=
pesquisa.value.toLowerCase();



document
.querySelectorAll(".lead-card")
.forEach(card=>{


card.style.display=

card.innerText
.toLowerCase()
.includes(termo)

?

"block"

:

"none";


});


});







function exportarBackup(){


let arquivo=

new Blob(

[
JSON.stringify(
leads,
null,
2
)

],

{
type:"application/json"
}

);



let a=document.createElement("a");


a.href=
URL.createObjectURL(arquivo);


a.download=
"backup-base7.json";


a.click();


}







render();


</script>


</body>

</html>
