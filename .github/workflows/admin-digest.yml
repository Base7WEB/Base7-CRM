name: Admin notification digest

on:
    schedule:
      - cron: "*/30 * * * *"
    workflow_dispatch: {}

jobs:
    digest:
      runs-on: ubuntu-latest
      steps:
        - name: Debug temporario
          env:
            BASE_URL: ${{ vars.CRM_BASE_URL }}
            CRON_SECRET: ${{ secrets.CRON_SECRET }}
          run: |
            echo "CRM_BASE_URL = '$BASE_URL'"
            echo "tamanho do CRON_SECRET = ${#CRON_SECRET}"
        - name: Chama endpoint de digest
          env:
            BASE_URL: ${{ vars.CRM_BASE_URL }}
            CRON_SECRET: ${{ secrets.CRON_SECRET }}
          run: |
            curl -v -sf -X GET "$BASE_URL/api/cron/admin-digest" -H "Authorization: Bearer $CRON_SECRET"
